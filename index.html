:root{--pg:#F2F0EC;--pg-ink:#121417;--pg-mute:#6E6B66;--pg-line:#DCD8D0;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{background:var(--pg)}
body{margin:0;background:var(--pg);color:var(--pg-ink);font-family:'Heebo','Stabil Grotesk',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
/* page chrome: one fixed layout in both languages. Both versions of every label sit in the same cell, so sizes never change */
.bi{display:grid}
.bi>*{grid-area:1/1}
span.bi{display:inline-grid}
.bi>[lang=he]{direction:rtl;font-family:'Heebo',system-ui,sans-serif}
.bi>[lang=en]{direction:ltr;font-family:'Rubik','Heebo',system-ui,sans-serif}
html[lang=he] .bi>[lang=en],html[lang=en] .bi>[lang=he]{visibility:hidden}
button{font:inherit}
.wrap{width:min(1200px,calc(100vw - 32px));margin:0 auto}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 6px}
.brand{font-family:'Stabil Grotesk',sans-serif;direction:ltr;font-size:21px;letter-spacing:-.02em;font-weight:400;margin:0}
.brand b{font-weight:700}
.seg{display:inline-flex;background:#E6E2DA;border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;color:var(--pg-ink);border-radius:999px;padding:0 16px;min-height:40px;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background-color .2s,color .2s}
.seg button:hover{background:rgba(0,0,0,.05)}
.seg button[aria-pressed=true]{background:#141210;color:#fff}
#langSeg button{min-width:84px}
#langSeg button[lang=en]{font-family:'Rubik','Heebo',system-ui,sans-serif}
.seg button:focus-visible,.ctl button:focus-visible,.ch:focus-visible{outline:2px solid #2E6BE6;outline-offset:2px}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;margin:8px 0 18px}
.eyebrow{font-size:14px;color:var(--pg-mute);margin:0 0 6px;width:100%}
.intro h1{font-size:clamp(26px,3.4vw,38px);font-weight:700;letter-spacing:-.015em;line-height:1.12;margin:0 0 16px;width:100%}
.sw{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw-alma{background:conic-gradient(#F8865B 0 50%,#F3EFE6 50% 100%)}
.sw-hand{background:conic-gradient(#1E1B18 0 50%,#F3EDE2 50% 100%)}
.sw-color{background:conic-gradient(#0061EF 0 50%,#FFCE00 50% 100%)}
.seg button[aria-pressed=true] .sw{box-shadow:0 0 0 2px #fff}

/* player */
.player{width:min(1200px,calc(100vw - 32px),max(480px,calc((100vh - 120px)*16/9)));margin:0 auto}
.stage{position:relative;aspect-ratio:16/9;overflow:hidden;container-type:inline-size;cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:18px;transition:background-color .6s}
.stage.swap{animation:swapin .45s ease}
.card,.blobs,.appbar,.cdots,.almac,.bgw{display:none}
.chr{display:none}
.flat .chr{display:block}
.ov{position:absolute;inset:0;z-index:9;display:grid;place-items:center;border:0;cursor:pointer;font:inherit;width:100%;background:rgba(242,240,236,.72);color:#141210}
.ov[hidden]{display:none}
.ov .pb{display:flex;flex-direction:column;align-items:center;gap:1.4cqi}
.ov .circle{width:10cqi;height:10cqi;border-radius:50%;background:#141210;display:grid;place-items:center}
.ov .tri{width:0;height:0;border-top:1.8cqi solid transparent;border-bottom:1.8cqi solid transparent;border-left:2.8cqi solid #fff;margin-left:.6cqi}
.ov .l{font-size:2.2cqi;font-weight:600;text-align:center;justify-items:center}
.ov .l small{display:block;font-size:1.6cqi;color:#6E6B66;font-weight:500}

/* chapters and controls: media controls stay left to right in both languages, like any video player */
.chap{display:flex;gap:4px;margin:12px 0 8px;direction:ltr}
.ch{flex-basis:0;cursor:pointer;min-width:0;background:none;border:0;padding:8px 0;color:inherit}
.ch .bar{height:5px;background:#DAD5CC;border-radius:3px;overflow:hidden;transition:background-color .2s}
.ch:hover .bar{background:#C9C3B8}
.ch .bar i{display:block;height:100%;width:0;background:#141210}
.ctl{display:flex;align-items:center;justify-content:center;gap:16px;direction:ltr}
.ctl button{width:46px;height:46px;padding:0;border-radius:50%;background:#fff;color:#141210;border:1px solid #DAD5CC;cursor:pointer;display:inline-grid;place-items:center;transition:background-color .2s}
.ctl button:hover{background:#F8F6F2}
.ctl #play{width:58px;height:58px;background:#141210;border-color:#141210;color:#fff}
.ctl #play:hover{background:#2C2925}
.ctl svg{width:20px;height:20px;display:block}
.ctl #play svg{width:26px;height:26px}

/* a few words for whoever presents */
.notes{width:min(720px,calc(100vw - 32px));margin:44px auto 0;padding-top:0}
.notes h2{font-size:14px;font-weight:600;color:var(--pg-mute);margin:0 0 14px}
.notes ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.notes li{position:relative;font-size:16px;line-height:1.55;color:#3C3A36;padding-inline-start:18px}
.notes li::before{content:'';position:absolute;inset-inline-start:0;top:.66em;width:6px;height:6px;border-radius:50%;background:#B5AEA3}
.notes li b{color:var(--pg-ink);font-weight:600}
.notes p{font-size:16px;line-height:1.6;color:#3C3A36;margin:0;text-wrap:pretty}
@media (max-width:600px){.seg button{padding:0 12px}.notes li,.notes p{font-size:15px}}

footer.foot{margin-top:56px;text-align:center;padding:0 0 28px;font-size:12px;color:#8A857D}
footer.foot p{margin:0}
footer.foot .copy{direction:ltr;unicode-bidi:isolate}

/* shared motion */
@keyframes swapin{from{opacity:.35}to{opacity:1}}
@keyframes jolt{20%{transform:translate(-3px,2px)}45%{transform:translate(3px,-2px)}70%{transform:translate(-2px,1px)}}
@keyframes jolt2{20%{transform:translate(-4px,3px) rotate(-.3deg)}45%{transform:translate(4px,-3px)}70%{transform:translate(-2px,1px)}}
@keyframes rise{from{opacity:0;transform:translateY(1cqi)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@keyframes drawon{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ride{0%{opacity:1;transform:translate(612px,22px) rotate(14deg)}90%{opacity:1}100%{opacity:0;transform:translate(26px,30px) rotate(-12deg)}}
@keyframes march{to{stroke-dashoffset:-.038}}
@keyframes nudge2{50%{transform:translateX(-9px)}}
@keyframes popin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-8px)}}
@keyframes wipe{0%{transform:none}45%{transform:translate(-60px,72px) rotate(-10deg)}100%{transform:translate(-172px,88px) rotate(-22deg)}}
@keyframes pull{0%{transform:none}45%{transform:translate(60px,12px) rotate(4deg)}100%{transform:translate(176px,30px) rotate(10deg)}}
@keyframes fwipe{0%{transform:none}45%{transform:translate(-42px,50px) rotate(-10deg)}100%{transform:translate(-118px,62px) rotate(-22deg)}}
@keyframes fpull{0%{transform:none}45%{transform:translate(-34px,4px) rotate(-3deg)}100%{transform:translate(-96px,8px) rotate(-8deg)}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-3cqi) rotate(calc(var(--r) * 3))}to{opacity:1;transform:rotate(var(--r))}}
@keyframes nudge{50%{transform:scale(1.18)}}
@keyframes marker{to{background-size:100% 100%}}
@keyframes write{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes stamp2{from{opacity:0;transform:scale(1.8) rotate(-14deg)}to{opacity:1;transform:rotate(-8deg)}}
@keyframes slam{from{opacity:0;transform:rotate(-3deg) scale(1.9)}55%{opacity:1}to{opacity:1;transform:rotate(-3deg) scale(1)}}
@keyframes slam2{0%{opacity:0;transform:rotate(-3deg) scale(1.7)}60%{opacity:1;transform:rotate(-3deg) scale(.95)}100%{opacity:1;transform:rotate(-3deg) scale(1)}}
@keyframes typing{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
@keyframes unveil{to{transform:scaleX(0)}}
@keyframes blink2{50%{opacity:.15}}
@keyframes bubIn{from{opacity:0;transform:scale(.6) translateY(1.6cqi)}to{opacity:1;transform:none}}
@keyframes tdot{50%{transform:translateY(-.5cqi);opacity:.5}}
@keyframes pill{from{opacity:0;transform:translateX(2cqi) scale(.8)}to{opacity:1;transform:none}}
@keyframes strikeX{to{transform:scaleX(1)}}
@keyframes strikeW{to{background-size:100% .3cqi}}
@keyframes dim{to{opacity:.4}}
@keyframes book{0%{opacity:0;transform:translateY(-12cqi)}55%{opacity:1;transform:translateY(0)}75%{transform:translateY(-.5cqi)}100%{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(3cqi) rotate(calc(var(--r0,0deg) * 3)) scale(.9)}to{opacity:1;transform:rotate(var(--r0,0deg))}}
@keyframes wpop{from{opacity:0;transform:translate(-50%,-50%) scale(0)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes lit{0%{opacity:.45}50%{transform:translate(-50%,-50%) scale(1.2)}100%{opacity:1;background:var(--hot-bg);color:var(--hot-t);transform:translate(-50%,-50%) scale(1.06)}}
@keyframes lineHot{to{stroke:var(--web-lh)}}
@keyframes ghIn{from{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(.5)}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r))}}
@keyframes fall{0%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(var(--y)) rotate(200deg)}}
@keyframes caret{0%{opacity:1}50%{opacity:0}}
@keyframes wpop2{from{opacity:0;transform:translateY(.8cqi) scale(.85)}to{opacity:1;transform:none}}
@keyframes flood{to{clip-path:circle(150% at var(--ox,12%) var(--oy,88%))}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}

  const learn=V('learn',`<div class="lrn"><div class="cf">${cf}</div><div class="lcs">${L.learn.map((t,k)=>`<div class="lc" style="--a:${(.5+k*1.8).toFixed(1)}s;--c:${(1.3+k*1.8).toFixed(1)}s"><span class="ck">${CK}</span><p>${t}</p></div>`).join('')}</div></div>`);

  /* 15. next lesson */
  const ring=[0,1,2,3,4,5,6,7].map(k=>`<i style="--k:${k}"></i>`).join('');
  const AR='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const next=V('next',`<div class="nxt"><div class="u dn"><span class="orb o1"><span class="rg">${ring}</span></span><span class="ckm">${CK}</span><b>${L.doneName}</b><small>${L.doneLbl}</small></div><svg class="ftrail" viewBox="0 0 140 40" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M4 20C40 0 100 40 136 20"/></svg><div class="u nx" id="nx"><span class="orb o2"><span class="rg">${ring}</span></span><small>${L.nextLbl}</small><b>${L.next.join(' ')}</b><span class="go">${L.go}${AR}</span><span class="soon2">${L.soon}</span></div></div>`);

  return chat+plate+tower+range+web+domGuess(L)+domPattern(L)+sup+roots+right+kit+proj+next+learn+domSeal(L);
}

/* ============ sound, made in the browser ============ */
const SND=(()=>{
  let ctx=null,comp,musG,musLP,epBus,fxG,noiseBuf,timer=null,nextT=0,step=0,musOn=true,fxOn=true,running=false,style='alma',popN=0,popT=-9;
  const BPM=116,S16=60/BPM/4;

  const LBPM=86,L16=60/LBPM/4,LOFI_LP=4200;
  const isLofi=()=>style==='color';
  const NOTE=m=>440*Math.pow(2,(m-69)/12);
  const CH=[[67,71,74,79],[64,67,71,76],[60,64,67,72],[62,66,69,74]];
  const BASS=[43,40,36,38];
  const HOOK=[79,null,81,79,76,null,74,null,76,79,null,83,null,81,79,null];
  function init(){
    if(ctx)return;
    try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ctx=null;return;}
    const mst=ctx.createGain();mst.gain.value=1.55;mst.connect(ctx.destination);
    comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.connect(mst);
    musG=ctx.createGain();musG.gain.value=0;
    musLP=ctx.createBiquadFilter();musLP.type='lowpass';musLP.Q.value=.5;musLP.frequency.value=isLofi()?LOFI_LP:20000;
    musG.connect(musLP);musLP.connect(comp);

    const trem=ctx.createOscillator();trem.frequency.value=4.6;const tdep=ctx.createGain();tdep.gain.value=.14;trem.connect(tdep).connect(epBus.gain);trem.start();
    fxG=ctx.createGain();fxG.gain.value=.62;fxG.connect(comp);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  function env(g,t,peak,att,dur){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);}
  function osc(type,f,t,dur,peak,out,f2,att=.006){const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=ctx.createGain();env(g,t,peak,att,dur);o.connect(g).connect(out);o.start(t);o.stop(t+dur+.05);return o;}

  function mar(t,m,peak,out,dur=.5){osc('sine',NOTE(m),t,dur,peak,out);osc('sine',NOTE(m)*3.99,t,.08,peak*.3,out,null,.003);}
  function bell(t,m,peak,out){osc('sine',NOTE(m),t,1.2,peak,out);osc('sine',NOTE(m)*2.76,t,.55,peak*.4,out);osc('sine',NOTE(m)*5.4,t,.22,peak*.2,out);}

  function stepAt(s,t){
    const barN=Math.floor(s/16),bar=barN%4,k=s%16,ch=CH[bar];

    if(k===0||k===8||k===11)osc('sine',125,t,.17,k===11?.28:.42,musG,44,.003);
    if(k===4||k===12){nz(t,.09,.17,'bandpass',1600,1.3,musG);nz(t+.012,.07,.1,'bandpass',2400,1.3,musG);}
    nz(t,.035,k%2?.028:.05,'highpass',7500,.7,musG);
    if(k===0||k===3||k===6||k===8||k===10||k===14){const bl=ctx.createBiquadFilter();bl.type='lowpass';bl.frequency.value=700;bl.connect(musG);const mv=k===6?7:k===10?12:k===14?10:0;osc('triangle',NOTE(BASS[bar]+mv),t,.26,.34,bl);}

  /* electric piano: two sines, the bright attack fades into a warm tone */
  function ep(t,m,peak,out,dur=1.4,idx=1.4){
    const f=NOTE(m),c=ctx.createOscillator(),mo=ctx.createOscillator(),mg=ctx.createGain(),g=ctx.createGain();
    c.type='sine';mo.type='sine';c.frequency.value=f;mo.frequency.value=f;

    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.008);g.gain.exponentialRampToValueAtTime(peak*.45,t+.25);g.gain.exponentialRampToValueAtTime(.0001,t+dur);

  function brass(t,m,peak,out,dur=.5){

    lp.frequency.setValueAtTime(350,t);lp.frequency.exponentialRampToValueAtTime(2600,t+.06);lp.frequency.exponentialRampToValueAtTime(900,t+dur);lp.connect(out);

  }
  function bassN(t,m,peak,dur){const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.connect(musG);osc('sine',NOTE(m),t,dur,peak,lp,null,.015);osc('triangle',NOTE(m),t,dur*.6,peak*.35,lp,null,.01);}
  const LCH=[[64,67,71,74],[60,64,67,71],[60,64,65,69],[59,64,65,69]];
  const LBASS=[36,33,38,31];
  const LMEL=[[[2,79],[5,76],[8,74]],[[2,76],[6,72]],[[2,77],[5,76],[8,74],[11,72]],[[4,71],[8,74]]];
  function stepLofi(s,t){
    const barN=Math.floor(s/16),bar=barN%4,k=s%16,ch=LCH[bar];
    if(k%2===1)t+=L16*.3;
    if(k===0||k===10||(k===7&&bar%2===1)){osc('sine',110,t,.32,k===0?.5:.36,musG,42,.004);nz(t,.012,.05,'lowpass',900,.7,musG);}
    if(k===4||k===12){nz(t,.16,.16,'bandpass',1500,.8,musG,900,.004);osc('triangle',190,t,.08,.1,musG,150,.002);}
    if(k%2===0)nz(t,.03,k%4===0?.035:.022,'highpass',6500,.7,musG);
    if(k===0)ch.forEach((m,j)=>ep(t+j*.012,m,.07,epBus,L16*14));
    if(k===6)ch.forEach((m,j)=>ep(t+j*.01,m,.045,epBus,L16*4));
    if(k===0)bassN(t,LBASS[bar],.3,L16*7);
    if(k===10)bassN(t,LBASS[bar]+7,.22,L16*4);
    if(barN%8>=4)LMEL[bar].forEach(([kk,m])=>{if(kk===k)ep(t,m,.06,epBus,L16*5,1.1);});
    if(Math.random()<.4)nz(t+Math.random()*L16,.003,.04+Math.random()*.06,'highpass',2200,.7,musG);
  }
  function sched(){while(nextT<ctx.currentTime+.12){if(isLofi()){stepLofi(step,nextT);nextT+=L16;}else{stepAt(step,nextT);nextT+=S16;}step++;}}
  function setStyle(s){if(s===style)return;style=s;if(!ctx)return;musLP.frequency.setTargetAtTime(isLofi()?LOFI_LP:20000,ctx.currentTime,.05);if(running){step=0;nextT=ctx.currentTime+.08;}}
  function start(){if(!ctx)return;if(ctx.state==='suspended')ctx.resume();if(running)return;running=true;nextT=ctx.currentTime+.06;timer=setInterval(sched,25);musG.gain.cancelScheduledValues(ctx.currentTime);musG.gain.setTargetAtTime(musOn?.27:0,ctx.currentTime,.3);}
  function stop(fade=.25){if(!ctx||!running)return;running=false;musG.gain.cancelScheduledValues(ctx.currentTime);musG.gain.setTargetAtTime(0,ctx.currentTime,fade);const tm=timer;setTimeout(()=>clearInterval(tm),fade*4000);}
  function setMus(on){musOn=on;if(ctx&&running){musG.gain.cancelScheduledValues(ctx.currentTime);musG.gain.setTargetAtTime(on?.27:0,ctx.currentTime,.2);}}
  function setFx(on){fxOn=on;}
  const FX={
    pop:t=>{osc('sine',620,t,.11,.32,fxG,250);nz(t,.02,.06,'highpass',3000,.7,fxG);},
    click:t=>{nz(t,.025,.3,'highpass',2600,.8,fxG);osc('square',1900,t,.02,.04,fxG);},
    ding:t=>{bell(t,88,.15,fxG);bell(t+.13,91,.13,fxG);},
    bwomp:t=>{const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(fxG);osc('sawtooth',196,t,.3,.12,lp,170,.02);osc('sawtooth',165,t+.28,.55,.12,lp,98,.02);},
    whoosh:t=>nz(t,.5,.22,'bandpass',350,.9,fxG,2600,.18),
    scribble:t=>{for(let i=0;i<9;i++)nz(t+i*.055+Math.random()*.02,.05,.09+Math.random()*.06,'bandpass',3200+Math.random()*1500,2.5,fxG);},
    type:t=>{let tt=t;for(let i=0;i<14;i++){tt+=.06+Math.random()*.05;nz(tt,.02,.18,'bandpass',2400+Math.random()*900,3,fxG);}},
    roll:t=>{for(let i=0;i<70;i++){nz(t+i*.065,.05,.015+i*.0011,'bandpass',1900,1,fxG);}},
    tada:t=>{[79,83,86,91].forEach((m,i)=>mar(t+i*.07,m,.2,fxG,.7));bell(t+.32,91,.1,fxG);},
    sparkle:t=>{for(let i=0;i<14;i++)osc('sine',2000+Math.random()*3000,t+i*.06+Math.random()*.03,.18,.045,fxG);},
    clink:t=>{[2120,3180,4460].forEach((f,i)=>osc('sine',f,t,.4-i*.08,.07,fxG));osc('sine',150,t,.12,.3,fxG,70,.002);nz(t,.03,.12,'highpass',2500,.7,fxG);},

    flutter:t=>{for(let i=0;i<9;i++){nz(t+i*.075,.1,.12,'bandpass',1500+Math.random()*1500,1.2,fxG,3500,.01);}},
    rise:t=>{osc('sine',190,t,1.7,.07,fxG,880,.4);nz(t,1.7,.1,'bandpass',300,1,fxG,3200,1.2);},
    ping:t=>{osc('sine',1568,t,.12,.11,fxG);osc('sine',2093,t+.07,.2,.09,fxG);},
    stamp:t=>{osc('sine',96,t,.28,.45,fxG,44,.002);nz(t,.1,.3,'lowpass',900,.7,fxG);nz(t,.03,.22,'highpass',3000,.7,fxG);},
    tick:t=>{nz(t,.06,.22,'bandpass',3800,2,fxG,2400);nz(t+.08,.05,.22,'bandpass',4300,2,fxG);},

    pop:t=>{if(t-popT>.45)popN=0;popT=t;ep(t,PENTA[Math.min(popN++,PENTA.length-1)],.12,fxG,.45,1.1);nz(t,.012,.05,'bandpass',1200,1,fxG);},

    logo:t=>{[48,55,64,67,71,74].forEach((m,j)=>ep(t+j*.06,m,.075,fxG,2.2,1.3));osc('sine',NOTE(36),t,1.6,.25,fxG,null,.02);}

  return{init,start,stop,fx,setMus,setFx,setStyle};
})();

  visuals=[...va.querySelectorAll('.v')];
  cards=[...va.querySelectorAll('.gc')];
  cards.forEach(c=>c.addEventListener('click',e=>{const m=META[i];if(m.v!=='guess'||m.s==='reveal')return;e.stopPropagation();begin();cards.forEach(x=>x.classList.remove('pick'));c.classList.add('pick');SND.fx([['pop',0]]);const r=META.findIndex(x=>x.v==='guess'&&x.s==='reveal');setTimeout(()=>render(r),650);}));
  const nx=va.querySelector('#nx');
  if(nx)nx.addEventListener('click',e=>{e.stopPropagation();const sc=nx.closest('.nxt');if(!sc)return;sc.classList.remove('tap');void sc.getBoundingClientRect();sc.classList.add('tap');SND.fx([['pop',0],['ding',150]]);});
  fitSvg();
}

function splitWords(root){
  let k=0;const nodes=[];const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  while(tw.nextNode()){const n=tw.currentNode;if(!n.parentElement.closest('svg'))nodes.push(n);}
  nodes.forEach(n=>{const f=document.createDocumentFragment();n.textContent.split(/(\s+)/).forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(p));return;}const s=document.createElement('span');s.className='tw';s.style.setProperty('--i',k++);s.textContent=p;f.appendChild(s);});n.replaceWith(f);});
  root.style.setProperty('--n',k);
}
function fitTxt(){
  const p=txt.firstElementChild;if(!p)return;let ts=1,k=0;txt.style.setProperty('--ts','1');
  while(k<12&&(p.scrollHeight>txt.clientHeight+2||p.scrollWidth>txt.clientWidth+2)){ts*=.93;txt.style.setProperty('--ts',ts.toFixed(3));k++;}
}
function fitSvg(){
  va.querySelectorAll('text[data-w]').forEach(t=>{
    if(!t.dataset.fs)t.dataset.fs=t.getAttribute('font-size');
    t.setAttribute('font-size',t.dataset.fs);
    let len=0;try{len=t.getComputedTextLength();}catch(e){return;}
    const w=+t.dataset.w;if(len>w&&len>0)t.setAttribute('font-size',(t.dataset.fs*w/len).toFixed(1));
  });
}

function chapterBg(ch){
  if(S.skin!=='color')return;
  if(ch===bgCh)return;const col=CBG[ch];
  if(bgCh<0||!started){stage.style.setProperty('--bg',col);bgCh=ch;return;}
  bgCh=ch;const w=document.createElement('i');w.style.background=col;bgw.appendChild(w);
  setTimeout(()=>{if(bgCh===ch)stage.style.setProperty('--bg',col);w.remove();},880);
}

function render(n){
  i=Math.max(0,Math.min(n,LAST));const m=META[i];
  txt.classList.remove('in');void txt.offsetWidth;
  txt.innerHTML='<p class="line">'+TXT[S.lang][i].replace('{{DECO}}',SKINS[S.skin].deco(S.lang))+'</p>';
  splitWords(txt.firstElementChild);txt.classList.add('in');
  stage.classList.toggle('has-v',!!m.v);stage.dataset.cv=m.v||'';stage.dataset.m=m.m||'';
  stage.classList.toggle('b0',i===0);
  for(let c=0;c<7;c++)stage.classList.toggle('c'+c,m.ch===c);
  chapterBg(m.ch);
  if(m.v==='guess'&&m.s!=='reveal')cards.forEach(c=>c.classList.remove('pick'));
  visuals.forEach(v=>{
    const on=v.dataset.v===m.v,was=v.classList.contains('show');
    if(on){const inner=v.firstElementChild;if(m.s&&(!was||inner.getAttribute('data-s')!==m.s)){inner.removeAttribute('data-s');void inner.getBoundingClientRect();inner.setAttribute('data-s',m.s);}if(!was){void v.offsetWidth;}}
    v.classList.toggle('show',on);
  });
  clearTimeout(joltT);stage.classList.remove('jolt');
  if(m.jolt)joltT=setTimeout(()=>{stage.classList.remove('jolt');void stage.offsetWidth;stage.classList.add('jolt');},m.jolt);
  const dots=[...$('#cdots').children];dots.forEach((d,k)=>{d.classList.toggle('dn',k<m.ch);d.classList.toggle('cur',k===m.ch);});
  $('#flame').textContent=String(m.ch);
  elapsed=0;dur=durOf(i);paint();fitTxt();
  if(started)SND.fx(m.fx);
}
function paint(){
  const pos=i+Math.min(elapsed/dur,1);
  chEls.forEach((el,k)=>{const f=Math.max(0,Math.min(1,(pos-chStart[k])/chCount[k]));el.querySelector('i').style.width=(f*100)+'%';el.classList.toggle('cur',META[i].ch===k);});
  stage.style.setProperty('--prog',(pos/N).toFixed(4));
}
function tick(ts){if(!last)last=ts;const dt=Math.min(ts-last,100);last=ts;if(playing){elapsed+=dt;if(elapsed>=dur){elapsed=dur;if(i===LAST){playing=false;updateBtn();SND.stop(1.2);}else if(auto){render(i+1);}}paint();}requestAnimationFrame(tick);}
function updateBtn(){const u=UI[S.lang];playIcon.innerHTML=playing?ICON_PAUSE:ICON_PLAY;playBtn.setAttribute('aria-label',playing?u.pause:u.play);playBtn.title=playing?u.pause:u.play;}
function begin(){if(!started){started=true;ov.hidden=true;SND.init();}}
function play(){if(!started){begin();render(0);}else if(i===LAST&&elapsed>=dur){render(0);}playing=true;updateBtn();SND.start();}
function pause(){playing=false;updateBtn();SND.stop();}
function toggle(){playing?pause():play();}
function next(){begin();if(i<LAST)render(i+1);}
function prev(){begin();render(i-1);}

function switchTo(key,val){
  if(S[key]===val)return;S[key]=val;save();
  stage.classList.remove('swap');void stage.offsetWidth;stage.classList.add('swap');
  applyUI();buildSkin();render(i);
}
document.querySelectorAll('#langSeg button').forEach(b=>b.addEventListener('click',()=>switchTo('lang',b.dataset.l)));
document.querySelectorAll('#skinSeg button').forEach(b=>b.addEventListener('click',()=>switchTo('skin',b.dataset.s)));
ov.addEventListener('click',e=>{e.stopPropagation();play();});
stage.addEventListener('click',()=>{if(!started){play();return;}next();});
playBtn.addEventListener('click',toggle);
$('#next').addEventListener('click',next);
$('#prev').addEventListener('click',prev);
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&(e.code==='Space'||e.code==='Enter'))return;
  if(e.code==='Space'){e.preventDefault();toggle();}
  else if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
});

/* hand drawn lines breathe a little */
let fcur=0;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{stage.classList.remove('f'+fcur);fcur=(fcur+1)%3;stage.classList.add('f'+fcur);},150);

buildChrome();applyUI();buildSkin();
if(HASH.has('b')){started=true;ov.hidden=true;render(+HASH.get('b')||0);}else{render(0);}
updateBtn();requestAnimationFrame(tick);
if(document.fonts){document.fonts.ready.then(()=>{fitSvg();fitTxt();});document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>{fitSvg();fitTxt();});}

</script>
</body>
